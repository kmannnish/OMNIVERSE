services:
  # Redis 7 for BullMQ Queue state and real-time Pub/Sub progress events
  redis:
    build:
      context: ./infra/redis
      dockerfile: Dockerfile
    container_name: media_flow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - media_net

  # Local S3-compatible Object Storage for high-speed local testing
  minio:
    build:
      context: ./infra/s3
      dockerfile: Dockerfile
    container_name: media_flow_minio
    ports:
      - "9000:9000" # S3 API endpoint
    environment:
      S3_BUCKET: media-storage
      DATA_DIR: /data
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - media_net

  # Fastify API Server with SSRF Protection, FFprobe probing, and BullMQ queue dispatch
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: media_flow_api
    command: ["node", "backend/dist/server.js"]
    ports:
      - "4001:4000"
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: production
      CORS_ORIGIN: "*"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: media-storage
      S3_FORCE_PATH_STYLE: "true"
      SCRATCH_DIR: /tmp/media-scratch
    depends_on:
      - redis
      - minio
    restart: unless-stopped
    networks:
      - media_net

  # Distributed Media Worker (FFmpeg Transcode, Stream-Copy, Direct S3 Streaming Upload, Sweeper)
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: media_flow_worker
    command: ["node", "backend/dist/worker-runner.js"]
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: media-storage
      S3_FORCE_PATH_STYLE: "true"
      SCRATCH_DIR: /tmp/media-scratch
      RETENTION_HOURS: 24
    depends_on:
      - redis
      - minio
    restart: unless-stopped
    networks:
      - media_net

  # Next.js App Router Web Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: media_flow_frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - media_net

volumes:
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  media_net:
    driver: bridge
